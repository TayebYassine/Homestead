# ============================================================================
#                    HOMESTEAD CONFIGURATION FILE
# ============================================================================
# Homestead - A free, open-source land claiming plugin for Minecraft
# Documentation: https://tayebyassine.github.io/Homestead/
# Discord Support: https://discord.gg/uh7gqDY6sz
# Repository: https://github.com/TayebYassine/Homestead
#
# IMPORTANT: Delete this file and restart to regenerate defaults
# All settings take effect after /hsadmin reload or server restart
# ============================================================================

# Debug Mode - Show detailed console messages for troubleshooting
# WARNING: Can flood console on busy servers. Only enable when debugging.
debug: false

# Anonymous Usage Statistics (bStats and FastStats)
# NO personal data collected. https://bstats.org/privacy-policy https://faststats.dev/privacy
metrics: true

# ============================================================================
# LANGUAGE AND MENUS CONFIGURATION
# ============================================================================

# Language file to load from languages/ folder
# Fallback: en-US if file doesn't exist
language: "en-US"

# Menu file to load from menus/ folder
# Fallback: en-US if file doesn't exist
menus: "en-US"

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================

# Database configuration - How do you want Homestead to store data?
# Note: Homestead uses ORMLite.
database:
  # Provider: sqlite (default), mysql, mariadb, postgresql
  # sqlite: Good for small-medium servers, no setup required
  # mysql/mariadb/postgresql: Good for large servers (100+ players)
  provider: "sqlite"

  # PostgreSQL settings (only used if provider = "postgresql")
  postgresql:
    host: "localhost"
    port: 5432
    username: "USERNAME"
    password: "PASSWORD"
    database: "homestead_data"
    table_prefix: ""
    jdbc_url_parameters: "" # Additional connection parameters, starts with "?"

  # MariaDB settings (only used if provider = "mariadb")
  mariadb:
    host: "localhost"
    port: 3306
    username: "USERNAME"
    password: "PASSWORD"
    database: "homestead_data"
    table_prefix: ""
    jdbc_url_parameters: "?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC" # Additional connection parameters, starts with "?"

  # MySQL settings (only used if provider = "mysql")
  mysql:
    host: "localhost"
    port: 3306
    username: "USERNAME"
    password: "PASSWORD"
    database: "homestead_data"
    table_prefix: ""
    jdbc_url_parameters: "" # Additional connection parameters, starts with "?"

  # SQLite filename (only used if provider = "sqlite")
  # Note: The file will be located in your server's main directory, not in the plugin's data folder.
  sqlite: "homestead_data.db"

# Cache Flush Interval (seconds)
# How often cached data is written to database
# Lower = frequent saves, more CPU usage | Higher = better performance, slight crash risk
# Recommendations: <20 players: 30s | 20-50: 60s | 50-100: 120-180s | 100+: 300s
cache-interval: 30

# ============================================================================
# PLUGIN INTEGRATIONS
# ============================================================================

# WorldGuard Integration
worldguard:
  # Prevent players from claiming inside WorldGuard regions?
  # true = Yes, false = No
  protect-existing-regions: true

# FastAsyncWorldEdit (FAWE) Integration
fastasyncworldedit:
  # Should chunks be regenerated when a chunk is unclaimed or a region gets deleted?
  # true = Yes, false = No
  # Note: This doesn't work on Folia servers!
  regenerate-chunks: false

# PlaceholderAPI Integration
placeholderapi:
  # Custom default values when a placeholder returns a null value
  default:
    region_bank: "None"
    region_name: "None"
    region_claimed_chunks: "0"
    region_max_chunks: "0"
    region_trusted_members: "0"
    region_max_members: "0"
    region_current: "&2Wilderness"
    upkeep_amount: "0,00"
    upkeep_at: "Never"
    war_name: "None"
    war_prize: "0,00"

# ============================================================================
# DYNAMIC MAPS VISUALIZATION TOOL
# ============================================================================

# Dynamic Web Maps Integration
# Supported plugins: dynmap, squaremap, BlueMap, Pl3xMap
dynamic-maps:
  # Do you want to enable Web Maps visualization?
  # true = Yes, false = No
  enabled: true

  # Update frequency (seconds).
  # Lower = faster updates, more CPU usage
  # If your server is massive, increase the update frequency up to 240 seconds.
  update-interval: 60

  # Custom region icons
  icons:
    # Do you want players to set custom icons for their regions?
    # true = Yes, false = No
    enabled: false

    # Default icon
    default: https://imgur.com/TUQzlCK.png

    # Icons size (20x20)
    size: 20

    # List of custom icons
    # Add as many icons as you want.
    list:
      Hut: https://imgur.com/GFrfD0H.png
      Outpost: https://imgur.com/4EvpONv.png
      Mansion: https://imgur.com/62ofr2V.png
      Igloo: https://imgur.com/OgBJV1H.png
      Gateway: https://imgur.com/7saPOc2.png
      Fortress: https://imgur.com/pqSHXJ6.png
      EndCity: https://imgur.com/bKRiedi.png
      Desert: https://imgur.com/EjQ5QJk.png
      Bastion: https://imgur.com/FwuLrG4.png
      Netherite: https://i.imgur.com/DTpAqCP.png
      Diamond: https://imgur.com/MQSe8Qs.png

  # Chunk display settings
  chunks:
    # Chunk marker display for regions owned by server operators
    # Note: For description, each new line (new array string) equals a new "<br>".
    operator-color: 16711680 # Chunk color
    operator-description:
      - '<div style="font-family:Arial,Helvetica,sans-serif;padding:14px;min-width:220px;line-height:1.6;"><img src="https://crafatar.com/avatars/{region-owner-uuid}" style="float:right;width:48px;height:48px;margin:0 0 10px 12px;border-radius:4px;image-rendering:pixelated;border:1px solid #bbb;"><div style="font-size:16px;margin-bottom:10px;"><b>{region} [Mod] (#{global-rank})</b></div>'
      - '<div style="margin-bottom:16px;"><i>{region-description}</i></div><div>'
      - '<b>Owner</b> — {region-owner}'
      - '<b>Members</b> — {region-members}'
      - '<b>Chunks</b> — {region-chunks}'
      - '<b>Size</b> — {region-size} blocks'
      - '<b>Founded</b> — {region-created-at}'
      - '</div></div>'

    # Chunk marker display for regions owned by non-server operators
    # Note: For description, each new line (new array string) equals a new "<br>".
    color: 65280 # Chunk color
    description:
      - '<div style="font-family:Arial,Helvetica,sans-serif;padding:14px;min-width:220px;line-height:1.6;"><img src="https://crafatar.com/avatars/{region-owner-uuid}" style="float:right;width:48px;height:48px;margin:0 0 10px 12px;border-radius:4px;image-rendering:pixelated;border:1px solid #bbb;"><div style="font-size:16px;margin-bottom:10px;"><b>{region} (#{global-rank})</b></div>'
      - '<div style="margin-bottom:16px;"><i>{region-description}</i></div><div>'
      - '<b>Owner</b> — {region-owner}'
      - '<b>Members</b> — {region-members}'
      - '<b>Chunks</b> — {region-chunks}'
      - '<b>Size</b> — {region-size} blocks'
      - '<b>Founded</b> — {region-created-at}'
      - '</div></div>'

    # Color transparency (alpha)
    transparency-fill: 40 # The transparency of the color (inside)
    transparency-outline: 125 # The transparency of the color (outside/border)

  # BlueMap configuration
  bluemap:
    # Always use 2D markers, even when users select 3D, it will always display 2D.
    # true = Always 2D, false = 3D and 2D
    use-2d-markers: false

# ============================================================================
# DISCORD INTEGRATION
# ============================================================================

# Discord Integration
# Send update messages via Discord, recommended for staff members
discord:
  # Do you want Homestead to send updates to Discord?
  # true = Yes, false = No
  enabled: false

  # The Discord Webhook URL, not your Discord bot token!
  # PLEASE KEEP THIS WEBHOOK URL A SECRET! DO NOT SHARE WITH ANY OTHER PERSON!
  # Example URL: https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN
  webhook_url: "YOUR_DISCORD_WEBHOOK_URL"

  # Handled events
  events:
    # When a region is created
    region_create:
      enabled: true
      message: "**[REGIONS]** Region created: {0}"

    # When a region is deleted
    region_delete:
      enabled: true
      message: "**[REGIONS]** Region deleted: {0}"

    # When a region is renamed
    region_rename:
      enabled: true
      message: "**[REGIONS]** Region name update: {0} -> {1}"

    # When a region's displayname is updated
    region_displayname_update:
      enabled: true
      message: "**[REGIONS]** Region display-name update: {0} -> {1}"

    # When a region's description is updated
    region_description_update:
      enabled: true
      message: "**[REGIONS]** Region description update: {0} -> {1}"

    # When a player sends a message in a region's private chat
    region_private_chat:
      enabled: true
      message: "**[CHAT]** Player {0} (`{1}`) -> {2}: *{3}*"

    # When a player bought a region, or a player gave their region to another player
    region_owner_transfer:
      enabled: true
      message: "**[REGIONS]** Region owner changed: {0} -> {1} (Region: {2})"

    # When a player sends a mail to a region
    player_send_mail:
      enabled: true
      message: "**[MAILS]** Player {0} (`{1}`) -> {2}: *{3}*"

    # When a player joined a region (trust)
    player_join_region:
      enabled: true
      message: "**[MEMBERS]** Player {0} (`{1}`) joined region: {2}"

    # When a player left a region (untrust)
    player_left_region:
      enabled: true
      message: "**[MEMBERS]** Player {0} (`{1}`) left region: {2}"

# ============================================================================
# PLAYER INPUT SESSION
# ============================================================================

# Player input configuration
# Player input happens when Homestead asks a player to send something in chat, for
# example, renaming a region, trusting player... etc.
# Note: Messages are configured inside the language file (en-US.yml)
player-input:
  # How do you want your players to see the player input message?
  # Available types: chat, title, actionbar
  type: "chat"
