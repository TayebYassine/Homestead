# ============================================================================
# REGIONS CONFIGURATION
# ============================================================================

# Startup Data Cleanup
# Remove invalid data on startup (orphaned regions, broken coordinates, etc.)
# true = Yes, false = No
clean-startup: true

# Welcome message
# Sends a message when a player joins the server
welcome-message:
  # Do you want Homestead to send a welcome message to players who join the server (not first time)?
  # true = Yes, false = No
  enabled: true

  # The message to send
  # Note: Use "\n" for a new line.
  message: "&eWelcome back, {player}!\nThere are &6{unread-logs} &eunread mails, with &6{regions-invited} &eregions sent you an invite!"

# Log Private Region Chat to Console
# Log all region chat messages for moderation purposes
# true = Yes, false = No
log-private-chat: true

# Adjacent Chunks Requirement
# Force all claimed chunks to be connected (no scattered claims)
# Disable for multi-location builds (bases + farms)
# true = Yes, false = No
adjacent-chunks: true

# Chunk Purchase Price
# Cost to claim one chunk (0.0 = free)
# Requires economy plugin
chunk-price: 0.0

# Auto-Select Target Region
# Automatically assign a random target region to new players
# true = Yes, false = No
autoset-target-region: true

# Disabled Worlds (Exact Names)
# List exact world names where claiming is disabled (case-sensitive)
# If there are no disabled worlds, make this an empty array:
# disabled-worlds-exact: []
disabled-worlds-exact:
  - "world_the_end"
  - "factions"
  - "pvp_arena"

# Disabled Worlds (Pattern Matching)
# Wildcard patterns for worlds where claiming is disabled
# * = any characters
# If there are no disabled worlds, make this an empty array:
# disabled-worlds-pattern: []
disabled-worlds-pattern:
  - "em_*"
  - "minigame_*_end"

# Region Borders Visualization
borders:
  # Enable border display toggle (/region borders)
  # true = Yes, false = No
  enabled: true

  # Display type:
  # - particles: Using dust particles around region borders, following player's Y position (recommended)
  # - blocks: Spawns fake blocks in the highest surface of the region borders
  # - glow: Spawns fake blocks with glowing effect around the region borders, following player's Y position
  type: particles

  # Dust colors, RGB format (type = 'particles')
  # Format: [RED, GREEN, BLUE], from 0 to 255.
  dust-colors:
    owner: [0, 255, 0]
    member: [255, 255, 0]
    visitor: [255, 0, 0]
    sub-area: [0, 179, 255]

  # Dust size (type = 'particles')
  dust-size: 3.0

  # Block type for block-based borders (type = 'blocks')
  block-type: GRAY_GLAZED_TERRACOTTA # Available types: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html

# Enter/Exit Region Messages
enter-exit-region-message:
  # Enable enter/exit messages
  # true = Yes, false = No
  enabled: true

  # Display type: title, actionbar, or chat
  type: 'title'

  # Message content (use & for colors)
  # Variables: {region-displayname}, {region-description}, {region-owner}
  messages:
    # The message when a player enters a region
    enter:
      title: [ "&2{region-displayname}", "&7{region-description}" ] # [ TITLE, SUBTITLE ]
      actionbar: "&7You enter the territory of &2{region-displayname}&7: {region-description}"
      chat: "&7You enter the territory of &2{region-displayname}&7: {region-description}"

    # The message when a player leaves a region
    exit:
      title: [ "&3Wilderness", "&7Roam the wild!" ] # [ TITLE, SUBTITLE ]
      actionbar: "&7You left the territory of &2{region-displayname}&7."
      chat: "&7You left the territory of &2{region-displayname}&7."

# Selection Tool
selection-tool:
  # Item used to select corners
  # See all available material types: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
  item:
    name: "&eSelection Tool"
    lore:
      - "&7Use this tool to create sub-areas or"
      - "&7claim new chunks!"
    type: GOLDEN_HOE # Use "NEXOMC-(id)" for custom NexoMC custom materials

  # Selection status messages
  messages:
    none: "&7Please select two corners/points inside or outside of the region."
    firstCorner: "&7First corner: &a✔ &7| Second corner: &c✘"
    secondCorner: "&7First corner: &c✘ &7| Second corner: &a✔"
    selectionDone: "&aYou can create a new sub-area or claim new chunks!"

# Region Upkeep System
# Requires Vault + economy plugin
# Note: Updating any value here requires a server restart.
upkeep:
  # Enable recurring maintenance fees
  # true = Yes, false = No
  enabled: false

  # Cost per chunk per payment period
  per-chunk: 100.0 # $100

  # Auto-unclaim chunks if payment fails
  # true = Yes, false = No
  unclaim-chunks: true

  # Grace period before first payment (seconds)
  # 604800 = 1 week, 1209600 = 2 weeks, 2592000 = 30 days
  start-upkeep: 604800 # 1 week = 604800 seconds

  # Payment frequency (seconds)
  upkeep-timer: 604800 # 1 week = 604800 seconds

# Member Taxes System
# Require members to pay fees to stay in region
# Note: Updating any value here requires a server restart.
taxes:
  # Enable taxation system
  # true = Yes, false = No
  enabled: false

  # Minimum tax price
  # If set to 0.0, trusted players can stay in regions permanently without paying
  min-tax: 0.0 # $0

  # Max tax price
  max-tax: 10000.0 # $10k

  # Tax frequency (seconds)
  tax-timer: 604800 # 1 week = 604800 seconds

# Region Renting System
# Note: Updating any value here requires a server restart.
renting:
  # Enable region renting
  # true = Yes, false = No
  enabled: true

  # Renting price
  price:
    # Default price given to newly created regions
    default: 1500.0 # $1.5k

    # Min and max price
    min: 500.0 # $500
    max: 10000000.0 # $10M

  # Renting duration
  duration:
    # Default duration given to newly created regions
    default: 7 # 7 days

    # Min and max duration (in days)
    min: 1 # 1 day
    max: 84 # 84 days (12 weeks)

  # Renting security deposit
  security-deposit:
    # Default security deposit given to newly created regions
    default: 500.0 # $500

    # Min and max security deposit
    min: 0.0 # $0
    max: 100000.0 # $100k

  # Notice to vacate (in days)
  notice-to-vacate: 3 # 3 days

# Region Selling System
selling:
  # Allow players to sell their regions
  # true = Yes, false = No
  enabled: true

  # Min and max price
  min-sell: 10.0 # $10
  max-sell: 1000000000.0 # $1B

# Sub-Areas Feature
# Create zones with different permissions within regions
sub-areas:
  # Allow players to create sub-areas
  # true = Yes, false = No
  enabled: true

# Wars System
# Region PvP conflicts with economic stakes
wars:
  # Enable wars
  # true = Yes, false = No
  enabled: false

  # Min and max prize
  min-prize: 1000.0 # $1k
  max-prize: 1000000000.0 # $1B

  # Force keep inventory when a player dies while part of a war?
  # This completely ignores the game rule set for any world.
  # true = Yes, false = No
  keep-inventory: false

  # Give the winning region owner's head to the region owner who won the war?
  # true = Yes, false = No
  give-head: true

  # Broadcast the message "A war has been declared"
  # - regions: Only sent to regions in the war
  # - server: Will be sent to the entire server
  # - silent: No message will be sent
  broadcast-type: "regions"

# Welcome Signs Feature
# Clickable signs that teleport to region homes
welcome-signs:
  # Enable welcome signs?
  # true = Yes, false = No
  enabled: false

# Reward System
# Bonus chunks/sub-areas for member count and playtime
rewards:
  # Enable rewarding system?
  # true = Yes, false = No
  enabled: true

  # Bonus per trusted member
  for-each-member:
    chunks: 2 # For each trusted member, the owner receives +2 chunks (e.g. 4 trusted players = 8 chunks rewarded)
    subareas: 1 # For each trusted member, the owner receives +1 sub-area (e.g. 4 trusted players = 4 sub-areas)

  # Playtime tiers (highest applicable tier only)
  # Time format: minutes + hours + days (additive)
  by-playtime:
    - minutes: 30
      hours: 0
      days: 0
      chunks: 1
      subareas: 1
    - minutes: 0
      hours: 3
      days: 0
      chunks: 2
      subareas: 2
    - minutes: 0
      hours: 12
      days: 0
      chunks: 4
      subareas: 3
    - minutes: 0
      hours: 0
      days: 1
      chunks: 6
      subareas: 4
    - minutes: 0
      hours: 0
      days: 3
      chunks: 8
      subareas: 6
    - minutes: 0
      hours: 0
      days: 7
      chunks: 10
      subareas: 8

# Region Storage
# Allow trusted players in a region to share a private chest for everyone, no permissions required
storage:
  # Enable region storage?
  # true = Yes, false = No
  enabled: false

  # Storage size, values: 9, 18, 27, 36, 45, or 54
  size: 27

# Special Features
special-feat:
  # TNT only explodes below Y=63 in regions (protects surface)
  # true = Yes, false = No
  tnt-explodes-only-below-sea-level: false

  # Disable region protection in disabled-worlds (recommended: true)
  # true = Yes, false = No
  ignore-region-protection-if-action-in-disabled-world: true

  # Skip trust acceptance (/region trust adds immediately without /region accept)
  # true = Yes, false = No
  ignore-trust-acceptance-system: false

  # Teleport to region spawn instead of world spawn when exiting End
  # true = Yes, false = No
  teleport-players-back-to-region-spawn-when-entering-end-exit-portal: true

# Teleport Delay System
delayed-teleport:
  # Enable countdown for /region visit, /region home, welcome signs
  # true = Yes, false = No
  enabled: true

  # Delay duration (seconds)
  delay: 3 # 3 seconds

  # Teleport cost (0.0 = free)
  price: 0.0 # $0

  # Cancel teleport if player moves
  # true = Yes, false = No
  cancel-on-move: true

  # Operators bypass delay
  # true = Yes, false = No
  ignore-operators: true

  # Boss bar countdown display
  boss-bar:
    # Enable boss bar
    # true = Yes, false = No
    enabled: true

    # Boss bar configuration
    title: "&7Teleporting in &3{seconds}s&7..." # Placeholders: {seconds}, {location}
    color: "PURPLE" # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/boss/BarColor.html
    style: "SEGMENTED_10" # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/boss/BarStyle.html
    countdown-mode: "DEPLETE" # DEPLETE / FILL

# Cooldown for actions
# Note: Restarting the server will reset the cooldowns!
cooldown:
  # Flag state change
  flag-change-state:
    ignore-operators: false # Operators bypass cooldown
    value: 3 # Cooldown in seconds

  # Region spawn update
  region-spawn-change:
    ignore-operators: true
    value: 600 # 10 minutes

  # Region name update
  region-rename-change:
    ignore-operators: true
    value: 600 # 10 minutes

  # Region description update
  region-description-change:
    ignore-operators: true
    value: 300 # 5 minutes

  # Region owner transfer
  # Sale signs are affected too!
  region-transfer-ownership:
    ignore-operators: true
    value: 604800 # 7 days

  # Region dynamic map settings change
  # This includes map coloring and region icon.
  region-dynamic-map-settings-change:
    ignore-operators: true
    value: 43200 # 12 hours

  # Region claim a chunk
  region-chunk-claim:
    ignore-operators: true
    value: 5 # 5 seconds

  # Region unclaim a chunk
  region-chunk-unclaim:
    ignore-operators: true
    value: 5 # 5 seconds

  # Region teleportation
  region-teleport:
    ignore-operators: true
    value: 15 # 15 seconds

  # Selection tool
  selection-tool:
    ignore-operators: false
    value: 604800 # 7 days (604800 seconds)

  # Prevent regions from changing the wars flag after participating in a war
  # From example below, if a region won or lost a war, they cannot change the wars flag state for 36 hours.
  war-flag-disabled:
    ignore-operators: true
    value: 129600 # 36 hours
