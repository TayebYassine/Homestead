# Configuration file for all menus

# Shared default buttons
defaults:
  back:
    name: "&c&lVolver"
    lore:
      - "&7Regresar al menú anterior."
    type: RED_STAINED_GLASS_PANE
  prev-page:
    name: "&9&lAnterior"
    lore:
      - "&7Ir a la página anterior."
    type: ARROW
  next-page:
    name: "&9&lSiguiente"
