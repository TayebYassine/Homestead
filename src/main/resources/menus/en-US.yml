# Configuration file for all menus

# Shared default buttons
defaults:
  back:
    name: "&c&lBack"
    lore:
      - "&7Return to the previous menu."
    type: RED_STAINED_GLASS_PANE
  prev-page:
    name: "&9&lPrevious"
    lore:
      - "&7Go to the previous page."
    type: ARROW
  next-page:
    name: "&9&lNext"
    lore:
      - "&7Go to the next page."
    type: ARROW
  empty-slot:
